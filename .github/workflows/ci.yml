name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      debug_runner:
        description: "Enable interactive tmate session in test-ext job"
        required: false
        default: false
        type: boolean

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pcov
          coverage: pcov

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run tests with coverage
        run: vendor/bin/phpunit --coverage-clover coverage.xml --coverage-text --log-junit junit.xml

      - name: Upload PHP coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: php

      - name: Upload PHP tests to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: junit.xml
          report_type: test_results
          flags: php

  test-ext:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get install -y lcov autoconf make

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: phpize, php-config

      - name: Build extension
        working-directory: ext
        run: |
          phpize
          ./configure --enable-phathom --with-phathom-coverage
          make -j$(nproc)

      - name: Debug runner via tmate
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_runner }}
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: true

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run tests and collect coverage
        working-directory: ext
        run: make phathom-test-coverage-lcov
        env:
          TEST_PHP_EXECUTABLE: php
          ZEND_DONT_UNLOAD_MODULES: 1
          PHPUNIT_ARGS: --log-junit ../junit-ext.xml

      - name: Collect crash diagnostics
        if: ${{ failure() }}
        run: |
          mkdir -p /tmp/phathom-crash
          find "$GITHUB_WORKSPACE" -maxdepth 3 -type f \( -name 'core' -o -name 'core.*' -o -name '*.log' -o -name 'junit-ext.xml' -o -name 'coverage.info' \) -exec cp -f {} /tmp/phathom-crash/ \; || true
          dmesg | tail -n 300 > /tmp/phathom-crash/dmesg-tail.txt || true

      - name: Upload crash diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-ext-crash-diagnostics
          path: /tmp/phathom-crash
          if-no-files-found: ignore

      - name: Upload C coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ext/coverage.info
          flags: ext

      - name: Upload C tests to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: junit-ext.xml
          report_type: test_results
          flags: ext
